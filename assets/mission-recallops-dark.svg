<text x="56" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#ece8e1">RecallOps</text>
<text x="56" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b0bc">Five incident-response agents share one memory in FalkorDB.</text>
<text x="56" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b0bc">They recall which fixes worked, across 3 dependency hops,</text>
<text x="56" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b0bc">and learn from every "fix worked / didn't work".</text>
