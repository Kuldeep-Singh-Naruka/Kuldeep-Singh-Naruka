<text x="56" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#1c2226">RecallOps</text>
<text x="56" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4a5156">Five incident-response agents share one memory in FalkorDB.</text>
<text x="56" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4a5156">They recall which fixes worked, across 3 dependency hops,</text>
<text x="56" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4a5156">and learn from every "fix worked / didn't work".</text>
<text x="56" y="232" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7a7f84" letter-spacing="1">5 LangGraph agents  ·  0 lost writes · 50 threads  ·  35 tests</text>
