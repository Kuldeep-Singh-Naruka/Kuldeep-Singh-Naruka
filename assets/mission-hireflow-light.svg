<text x="56" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#1c2226">HireFlow</text>
<text x="56" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4a5156">AI candidate screening &amp; interview intelligence. Maps every</text>
